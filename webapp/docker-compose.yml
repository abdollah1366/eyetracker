# ADHD Eye-Tracking CDSS — local / production-shaped compose stack.
# Copy .env.example to .env and adjust secrets before deploying.
# NOTE: getUserMedia (camera) requires HTTPS or localhost. For non-local
# deployments, terminate TLS in front of the `frontend` service.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eye_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-eye_tracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eye_tracker} -d ${POSTGRES_DB:-eye_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eye_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-eye_tracker}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eye_tracker}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-eye_tracker}
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me}
      MIN_VALID_GAZE_RATIO: ${MIN_VALID_GAZE_RATIO:-0.70}
      MAX_TRACKING_GAP_SEC: ${MAX_TRACKING_GAP_SEC:-0.75}
      BRIGHTNESS_MIN: ${BRIGHTNESS_MIN:-25}
      BRIGHTNESS_MAX: ${BRIGHTNESS_MAX:-235}
      MAX_CALIBRATION_ERROR_PX: ${MAX_CALIBRATION_ERROR_PX:-180}
      STIMULUS_TARGET: ${STIMULUS_TARGET:-10}
      STIMULUS_DURATION_SEC: ${STIMULUS_DURATION_SEC:-10}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    volumes:
      - ./backend/artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin path; nginx proxies /api/ to the backend service.
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"

volumes:
  pgdata:
